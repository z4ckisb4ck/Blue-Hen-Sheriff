<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Hen Sheriff - Page 2</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .computer-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 60px;
        }
        .monitor {
            width: 420px;
            height: 260px;
            background: #222;
            border-radius: 18px 18px 8px 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .monitor-screen {
            width: 370px;
            height: 180px;
            background: #e8f0fa;
            border-radius: 10px;
            box-shadow: 0 0 0 4px #333 inset;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .keyboard {
            width: 340px;
            height: 38px;
            background: #bbb;
            border-radius: 6px;
            margin-top: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }
        .key {
            width: 22px;
            height: 22px;
            background: #eee;
            border: 1px solid #aaa;
            border-radius: 3px;
            margin: 2px;
        }
        .mouse {
            width: 38px;
            height: 60px;
            background: #eee;
            border-radius: 20px 20px 30px 30px / 30px 30px 40px 40px;
            margin-top: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            position: relative;
        }
        .mouse-wheel {
            width: 8px;
            height: 14px;
            background: #bbb;
            border-radius: 4px;
            position: absolute;
            left: 50%;
            top: 16px;
            transform: translateX(-50%);
        }
        .input-box {
            width: 220px;
            height: 32px;
            font-size: 1.1rem;
            border: 1.5px solid #888;
            border-radius: 6px;
            padding: 4px 10px;
            margin: 0 auto;
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="computer-area" style="flex-direction: row; align-items: flex-end; justify-content: center; gap: 36px;">
        <div style="display: flex; flex-direction: column; align-items: center;">
            <div class="monitor">
                <div class="monitor-screen">
                    <input class="input-box" type="text" placeholder="Type here...">
                </div>
            </div>
            <div class="keyboard">
                <div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div>
                <div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div>
                <div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div>
            </div>
        </div>
        <div class="mouse">
            <div class="mouse-wheel"></div>
        </div>
    </div>
</body>
</html>
