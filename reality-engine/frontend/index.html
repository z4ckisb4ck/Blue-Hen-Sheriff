<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reality Engine - Content Authenticity Detector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="assets/sheriff.png" alt="Sheriff Badge" class="logo">
            <h1>🤠 Blue Hen Sheriff</h1>
            <p class="subtitle">Detecting Reality, One Frame at a Time</p>
        </header>

        <main>
            <div class="detector-panel">
                <h2>Content Analysis</h2>
                
                <div class="upload-section">
                    <h3>Upload Content</h3>
                    <form id="uploadForm">
                        <div class="input-group">
                            <label for="contentType">Content Type:</label>
                            <select id="contentType" name="contentType" required>
                                <option value="video">Video</option>
                                <option value="audio">Audio</option>
                                <option value="text">Text</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label for="fileInput">Select File:</label>
                            <input type="file" id="fileInput" name="file" required>
                        </div>

                        <button type="submit" class="btn-primary">Analyze Content</button>
                    </form>
                </div>

                <div class="results-section" id="resultsSection" style="display: none;">
                    <h3>Analysis Results</h3>
                    <div class="result-card">
                        <div class="score-display">
                            <div class="authenticity-score" id="authenticityScore">--</div>
                            <p>Authenticity Score</p>
                        </div>
                        <div class="verdict" id="verdict">ANALYZING...</div>
                    </div>

                    <div class="details">
                        <h4>Detailed Analysis</h4>
                        <div id="detailedResults"></div>
                    </div>
                </div>

                <div class="loading-section" id="loadingSection" style="display: none;">
                    <img src="assets/lasso.gif" alt="Loading..." class="spinner">
                    <p>Analyzing your content...</p>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Blue Hen Sheriff. Protecting digital integrity.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
